name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMAVGS_WERROR=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="mavlink-ground-station-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp build/mavgcs build/mavsim README.md LICENSE CHANGELOG.md "dist/${name}/"
          cp -r examples "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: '*.tar.gz'

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            /^## \[/ { found = 0 }
            /^\[.*\]: / { next }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for ${version}" >&2; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md *.tar.gz SHA256SUMS
